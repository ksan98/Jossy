<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Jossy 🌻❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#fffaf0,#fcebb3,#f8d767);
    overflow:hidden;
}

h1,.love-message{
    color:#8c5b00;
    text-align:center;
    text-shadow:1px 1px 4px rgba(255,255,255,.8);
    animation:textMove 3s ease-in-out infinite;
}

h1{
    margin-bottom:10px;
}

.love-message{
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
}

@keyframes textMove{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-6px);}
}

.hearts{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.heart{
    position:absolute;
    font-size:24px;
    color:rgba(220,20,60,.6);
    animation:floatHeart 8s linear infinite;
}

@keyframes floatHeart{
    0%{
        transform:translateY(100vh);
        opacity:0;
    }
    20%,80%{
        opacity:1;
    }
    100%{
        transform:translateY(-120px);
        opacity:0;
    }
}

.bouquet{
    position:relative;
    width:550px;
    height:500px;
    animation:sway 4s ease-in-out infinite;
    transform-origin:center bottom;
}

@keyframes sway{
    0%,100%{transform:rotate(-2deg);}
    50%{transform:rotate(2deg);}
}

.wrapper{
    position:absolute;
    width:500px;
    height:420px;
    left:25px;
    top:30px;
    background:linear-gradient(145deg,
    rgba(245,205,215,.95),
    rgba(220,170,180,.95));
    clip-path:polygon(
        50% 100%,
        0% 25%,
        12% 0%,
        50% 15%,
        88% 0%,
        100% 25%
    );
    z-index:1;
}

.stem{
    position:absolute;
    width:6px;
    background:#2e7d32;
    border-radius:10px;
    z-index:2;
}

.s1{height:240px;left:272px;top:120px;}
.s2{height:240px;left:272px;top:120px;transform:rotate(18deg);}
.s3{height:240px;left:272px;top:120px;transform:rotate(-18deg);}
.s4{height:200px;left:272px;top:180px;transform:rotate(8deg);}
.s5{height:200px;left:272px;top:180px;transform:rotate(-8deg);}

.flower-box{
    position:absolute;
    width:100px;
    height:100px;
    z-index:5;
}

.f1{top:20px;left:225px;transform:scale(1.1);}
.f2{top:80px;left:140px;}
.f3{top:80px;left:225px;}
.f4{top:80px;left:310px;}
.f5{top:160px;left:95px;}
.f6{top:160px;left:180px;}
.f7{top:160px;left:265px;}
.f8{top:160px;left:350px;}
.f9{top:240px;left:180px;}
.f10{top:240px;left:265px;}

.flower{
    position:relative;
    width:100px;
    height:100px;
}

.petal{
    position:absolute;
    width:16px;
    height:48px;
    background:linear-gradient(to top,#ff9800,#ffd700);
    border-radius:50%;
    left:42px;
    top:0;
    transform-origin:center 50px;
}

.core{
    position:absolute;
    width:36px;
    height:36px;
    border-radius:50%;
    background:#5d4037;
    border:4px solid #8d6e63;
    left:32px;
    top:32px;
    z-index:2;
}

.ribbon{
    position:absolute;
    width:45px;
    height:22px;
    background:#d32f2f;
    left:253px;
    bottom:80px;
    border-radius:5px;
    z-index:6;
}

#musicBtn{
    margin-top:15px;
    padding:12px 22px;
    border:none;
    border-radius:30px;
    background:#d32f2f;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

#musicBtn:hover{
    background:#b71c1c;
}
</style>
</head>

<body>

<div class="hearts">
    <div class="heart" style="left:10%">❤️</div>
    <div class="heart" style="left:25%">❤️</div>
    <div class="heart" style="left:40%">❤️</div>
    <div class="heart" style="left:55%">❤️</div>
    <div class="heart" style="left:75%">❤️</div>
    <div class="heart" style="left:90%">❤️</div>
</div>

<h1>
🌻 Feliz 21 de Setiembre mi amor ❤️<br>
Jossy 🐥
</h1>

<div class="bouquet">

<div class="wrapper"></div>

<div class="stem s1"></div>
<div class="stem s2"></div>
<div class="stem s3"></div>
<div class="stem s4"></div>
<div class="stem s5"></div>

<div class="flower-box f1"><div class="flower"></div></div>
<div class="flower-box f2"><div class="flower"></div></div>
<div class="flower-box f3"><div class="flower"></div></div>
<div class="flower-box f4"><div class="flower"></div></div>
<div class="flower-box f5"><div class="flower"></div></div>
<div class="flower-box f6"><div class="flower"></div></div>
<div class="flower-box f7"><div class="flower"></div></div>
<div class="flower-box f8"><div class="flower"></div></div>
<div class="flower-box f9"><div class="flower"></div></div>
<div class="flower-box f10"><div class="flower"></div></div>

<div class="ribbon"></div>

</div>

<div class="love-message">
Gracias por hacer florecer mi corazón cada día 🌻❤️
</div>

<button id="musicBtn">
🎵 Reproducir
</button>

<audio id="bgMusic" preload="auto" loop>
    flores-amarillas.mp3
</audio>

<script>

document.querySelectorAll('.flower').forEach(flower => {

    for(let i=0;i<16;i++){

        const petal=document.createElement('div');
        petal.classList.add('petal');
        petal.style.transform=`rotate(${i*22.5}deg)`;
        flower.appendChild(petal);

    }

    const core=document.createElement('div');
    core.classList.add('core');
    flower.appendChild(core);

});

const music=document.getElementById("bgMusic");
const btn=document.getElementById("musicBtn");

btn.addEventListener("click",()=>{

    if(music.paused){

        music.play();
        btn.textContent="⏸️ Pausar";

    }else{

        music.pause();
        btn.textContent="🎵 Reproducir";

    }

});

</script>

</body>
</html>
