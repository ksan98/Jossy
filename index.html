<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Jossy 🌻❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#fff8dc,#ffe082,#ffd54f);
    font-family:Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.hearts{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
}

.heart{
    position:absolute;
    animation:floatHeart linear infinite;
}

@keyframes floatHeart{

    0%{
        transform:translateY(110vh) translateX(0);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:translateY(-120px) translateX(50px);
        opacity:0;
    }

}

h1{
    text-align:center;
    color:#8c5b00;
    z-index:10;
    margin-bottom:20px;
}

.bouquet{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    z-index:10;
}

.flower{
    font-size:70px;
    animation:sway 3s ease-in-out infinite;
}

@keyframes sway{

    0%,100%{
        transform:rotate(-5deg);
    }

    50%{
        transform:rotate(5deg);
    }

}

.love-message{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
    color:#8c5b00;
    text-align:center;
    z-index:10;
}

#musicBtn{

    margin-top:20px;

    border:none;

    background:#d32f2f;
    color:white;

    padding:14px 24px;

    border-radius:30px;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    z-index:10;
}

#musicBtn:hover{
    background:#b71c1c;
}

</style>
</head>
