
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Jossy 🌻❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    font-family:Arial,sans-serif;

    background:linear-gradient(
        135deg,
        #fff8dc,
        #ffe082,
        #ffd54f
    );
}

.hearts{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
}

.heart{
    position:absolute;
    animation:floatHeart linear infinite;
    opacity:.8;
}

@keyframes floatHeart{

    0%{
        transform:
        translateY(110vh)
        translateX(0);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    50%{
        transform:
        translateY(50vh)
        translateX(-30px);
    }

    100%{
        transform:
        translateY(-120px)
        translateX(40px);
        opacity:0;
    }

}

h1{
    text-align:center;
    color:#8c5b00;

    margin-bottom:20px;

    z-index:10;
}

.bouquet{
    position:relative;
    width:320px;
    height:320px;
    z-index:10;
}

.flower{
    position:absolute;
    font-size:70px;
}

.f1{top:20px;left:120px;}
.f2{top:90px;left:40px;}
.f3{top:90px;left:120px;}
.f4{top:90px;left:200px;}
.f5{top:160px;left:0;}
.f6{top:160px;left:80px;}
.f7{top:160px;left:160px;}
.f8{top:160px;left:240px;}

.love-message{
    margin-top:15px;
    font-size:22px;
    font-weight:bold;
    color:#8c5b00;
    text-align:center;
    z-index:10;
}

#musicBtn{

    margin-top:20px;

    background:#d32f2f;
    color:white;

    border:none;

    padding:14px 25px;

    border-radius:30px;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    z-index:10;
}

#musicBtn:hover{
    background:#b71c1c;
}

#youtubePlayer{
    position:absolute;
    left:-9999px;
}

</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<h1>
🌻 Feliz 21 de Setiembre mi amor ❤️ <br>
Jossy 🐥
</h1>

<div class="bouquet">

<div class="flower f1">🌻</div>
<div class="flower f2">🌻</div>
<div class="flower f3">🌻</div>
<div class="flower f4">🌻</div>
<div class="flower f5">🌻</div>
<div class="flower f6">🌻</div>
<div class="flower f7">🌻</div>
<div class="flower f8">🌻</div>

</div>

<div class="love-message">
Gracias por hacer florecer mi corazón cada día 🌻❤️
</div>

<button id="musicBtn">
🎵 Reproducir
</button>

https://www.youtube.com/embed/gv63CGCx6vg?enablejsapi=1
</iframe>

https://www.youtube.com/iframe_apiscript>

<script>

const heartsContainer =
document.getElementById("hearts");

for(let i=0;i<50;i++){

    const heart =
    document.createElement("div");

    heart.className = "heart";

    heart.innerHTML = "❤️";

    heart.style.left =
    Math.random()*100+"%";

    heart.style.fontSize =
    (15+Math.random()*25)+"px";

    heart.style.animationDuration =
    (5+Math.random()*10)+"s";

    heart.style.animationDelay =
    (Math.random()*8)+"s";

    heartsContainer.appendChild(heart);

}

let player;
let reproduciendo = false;

function onYouTubeIframeAPIReady(){

    player = new YT.Player('youtubePlayer');

}

const btn =
document.getElementById("musicBtn");

btn.addEventListener("click",()=>{

    if(!player) return;

    if(!reproduciendo){

        player.playVideo();

        btn.textContent =
        "⏸️ Pausar";

        reproduciendo=true;

    }else{

        player.pauseVideo();

        btn.textContent =
        "🎵 Reproducir";

        reproduciendo=false;

    }

});

</script>

</body>
</html>
